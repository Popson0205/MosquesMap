<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MosqueMap Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕌</text></svg>">
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🕌</div>
    <div class="logo-text"><h2>MosqueMap</h2><p>Admin Portal</p></div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-section-label">Overview</div>
    <button class="nav-link active" data-page="dashboard" onclick="navigate('dashboard',this)"><span class="nav-icon">📊</span>Dashboard</button>
    <div class="nav-section-label">Mosques</div>
    <button class="nav-link" data-page="mosques" onclick="navigate('mosques',this)"><span class="nav-icon">🕌</span>All Mosques</button>
    <button class="nav-link" data-page="submissions" onclick="navigate('submissions',this)"><span class="nav-icon">📥</span>Submissions<span class="nav-badge" id="sub-badge">3</span></button>
    <button class="nav-link" data-page="map" onclick="navigate('map',this)"><span class="nav-icon">🗺️</span>Map View</button>
    <div class="nav-section-label">System</div>
    <button class="nav-link" data-page="users" onclick="navigate('users',this)"><span class="nav-icon">👥</span>Users</button>
    <button class="nav-link" data-page="settings" onclick="navigate('settings',this)"><span class="nav-icon">⚙️</span>Settings</button>
  </div>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="sidebar-avatar">👤</div>
      <div class="sidebar-user-info">
        <p id="sidebar-name">Admin</p>
        <span id="sidebar-email">admin@mosquemap.ng</span>
      </div>
    </div>
    <button class="logout-btn" onclick="doLogout()">🚪 Sign Out</button>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">Dashboard</div>
    <div class="topbar-right">
      <button class="topbar-btn" onclick="navigate('submissions',document.querySelector('[data-page=submissions]'))">📥 <span id="topbar-pending">3</span> Pending</button>
      <button class="topbar-btn primary" onclick="openAddModal()">+ Add Mosque</button>
    </div>
  </div>
  <div class="page-content" id="page-content">
    <!-- Pages rendered here -->
  </div>
</div>

<!-- ADD/EDIT MOSQUE MODAL -->
<div class="modal-overlay" id="mosque-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Add New Mosque</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group" style="grid-column:1/-1">
        <label>Mosque Name *</label>
        <input type="text" id="m-name" placeholder="e.g. Ansar-Ud-Deen Society Mosque">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Latitude *</label>
        <input type="number" id="m-lat" placeholder="6.5244" step="0.0001">
      </div>
      <div class="form-group">
        <label>Longitude *</label>
        <input type="number" id="m-lng" placeholder="3.3792" step="0.0001">
      </div>
    </div>
    <div id="modal-map" class="modal-map"></div>
    <div class="form-row">
      <div class="form-group" style="grid-column:1/-1">
        <label>Address</label>
        <input type="text" id="m-address" placeholder="Surulere, Lagos State">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Phone (optional)</label>
        <input type="tel" id="m-phone" placeholder="+234 800 000 0000">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="m-status"><option value="pending">Pending Review</option><option value="verified">Verified</option><option value="rejected">Rejected</option></select>
      </div>
    </div>
    <div class="form-group"><label>State</label><select id="m-state" style="width:100%;height:40px;background:#f5f5f5;border:1.5px solid rgba(0,0,0,0.08);border-radius:8px;padding:0 12px;font-size:13px;font-family:Inter,sans-serif;outline:none"><option value="">Select state...</option></select></div>
    <div class="form-group">
      <label>Facilities (comma-separated)</label>
      <input type="text" id="m-facilities" placeholder="wudu, parking, women, wheelchair">
    </div>
    <div class="form-group">
      <label>About</label>
      <textarea id="m-about" placeholder="Brief description of the mosque..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveMosque()">Save Mosque</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/admin.js"></script>
</body>
</html>
